<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Cyber threat detected security alert</title>
  <desc id="desc">A glowing red warning shield surrounded by network connections and a security monitoring interface.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07172c"/>
      <stop offset=".55" stop-color="#102c4b"/>
      <stop offset="1" stop-color="#171b3c"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#173857" stop-opacity=".94"/>
      <stop offset="1" stop-color="#10233e" stop-opacity=".94"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff526b"/>
      <stop offset="1" stop-color="#d92752"/>
    </linearGradient>
    <radialGradient id="alertGlow">
      <stop stop-color="#ff4165" stop-opacity=".4"/>
      <stop offset="1" stop-color="#ff4165" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#70c9f5" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" rx="26" fill="url(#background)"/>
  <rect width="800" height="450" rx="26" fill="url(#grid)"/>
  <circle cx="400" cy="224" r="205" fill="url(#alertGlow)"/>

  <g fill="none" stroke="#5ec8ef" stroke-opacity=".4" stroke-width="2">
    <path d="M70 116H190L245 171M730 116H610L555 171M70 334H190L250 276M730 334H610L550 276"/>
    <path d="M104 225H202L248 225M696 225H598L552 225"/>
    <path d="M142 116V153M658 116V153M142 334V297M658 334V297"/>
  </g>
  <g fill="#78ddff">
    <circle cx="70" cy="116" r="5"/><circle cx="730" cy="116" r="5"/>
    <circle cx="70" cy="334" r="5"/><circle cx="730" cy="334" r="5"/>
    <circle cx="104" cy="225" r="4"/><circle cx="696" cy="225" r="4"/>
  </g>

  <rect x="84" y="42" width="632" height="44" rx="13" fill="#07182b" fill-opacity=".7" stroke="#4b82a8" stroke-opacity=".58"/>
  <circle cx="108" cy="64" r="6" fill="#ff526b" filter="url(#softGlow)"/>
  <text x="126" y="69" fill="#d7efff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2">SECURITY OPERATIONS CENTER</text>
  <text x="690" y="69" text-anchor="end" fill="#8eb5d2" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1">LIVE MONITORING</text>

  <rect x="246" y="105" width="308" height="242" rx="25" fill="url(#panel)" stroke="#64b9e7" stroke-opacity=".65" stroke-width="2"/>
  <rect x="262" y="121" width="276" height="210" rx="18" fill="none" stroke="#87d7ff" stroke-opacity=".13"/>
  <text x="400" y="151" text-anchor="middle" fill="#a9d7f1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="3">NETWORK STATUS</text>

  <path d="M400 169L474 198V245C474 290 443 315 400 329C357 315 326 290 326 245V198Z" fill="#ff4969" fill-opacity=".17" stroke="#ff6a7f" stroke-width="2" filter="url(#softGlow)"/>
  <path d="M400 182L461 206V245C461 279 439 299 400 313C361 299 339 279 339 245V206Z" fill="url(#shield)" stroke="#ffb0ba" stroke-opacity=".8" stroke-width="2"/>
  <path d="M400 207V253" stroke="#fff4f4" stroke-width="10" stroke-linecap="round"/>
  <circle cx="400" cy="274" r="6" fill="#fff4f4"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="102" y="176" width="118" height="70" rx="12" fill="#0b2038" stroke="#3e7599"/>
    <text x="161" y="202" text-anchor="middle" fill="#8eb5d2" font-size="11" font-weight="700" letter-spacing="1">FIREWALL</text>
    <text x="161" y="226" text-anchor="middle" fill="#78e2bd" font-size="14" font-weight="700">ACTIVE</text>
    <rect x="580" y="176" width="118" height="70" rx="12" fill="#0b2038" stroke="#a6405e"/>
    <text x="639" y="202" text-anchor="middle" fill="#d9b3c0" font-size="11" font-weight="700" letter-spacing="1">THREAT LEVEL</text>
    <text x="639" y="226" text-anchor="middle" fill="#ff7385" font-size="14" font-weight="700">ELEVATED</text>
  </g>

  <rect x="284" y="364" width="232" height="42" rx="21" fill="#a92348" stroke="#ff7184" stroke-width="1.5"/>
  <text x="404" y="391" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2">THREAT DETECTED</text>
</svg>
