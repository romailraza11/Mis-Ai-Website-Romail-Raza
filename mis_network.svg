<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Management information systems network</title>
  <desc id="desc">A glowing data network links people, business systems, analysis, and informed decisions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071a32"/><stop offset=".55" stop-color="#103c62"/><stop offset="1" stop-color="#126b77"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1a5272" stop-opacity=".92"/><stop offset="1" stop-color="#102b50" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#72f3e2"/><stop offset="1" stop-color="#61baff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a6e7ff" stroke-opacity=".07"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" rx="26" fill="url(#bg)"/>
  <rect width="800" height="450" rx="26" fill="url(#grid)"/>
  <text x="42" y="52" fill="#a7d7e9" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3">CONNECTED BUSINESS INTELLIGENCE</text>
  <text x="758" y="52" text-anchor="end" fill="#75e8d9" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">SYSTEM ONLINE</text>

  <g fill="none" stroke="#6ce6e6" stroke-opacity=".7" stroke-width="2">
    <path d="M118 132L260 176L390 112L535 176L680 128"/>
    <path d="M118 132L170 302L318 340L482 300L680 128"/>
    <path d="M260 176L318 340L535 176L482 300L170 302L260 176"/>
    <path d="M390 112L390 160M390 290L390 340"/>
    <path d="M170 302L250 238M482 300L535 236"/>
  </g>
  <g fill="#a9fff3" stroke="#e7ffff" stroke-width="2" filter="url(#glow)">
    <circle cx="118" cy="132" r="8"/><circle cx="260" cy="176" r="8"/><circle cx="390" cy="112" r="8"/>
    <circle cx="535" cy="176" r="8"/><circle cx="680" cy="128" r="8"/><circle cx="170" cy="302" r="8"/>
    <circle cx="318" cy="340" r="8"/><circle cx="482" cy="300" r="8"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">
    <rect x="68" y="183" width="116" height="44" rx="22" fill="#0a2543" stroke="#55bad3"/>
    <text x="126" y="210" text-anchor="middle" fill="#bcecff">PEOPLE</text>
    <rect x="616" y="183" width="116" height="44" rx="22" fill="#0a2543" stroke="#55bad3"/>
    <text x="674" y="210" text-anchor="middle" fill="#bcecff">SYSTEMS</text>
  </g>

  <rect x="238" y="194" width="324" height="88" rx="22" fill="url(#glass)" stroke="url(#accent)" stroke-width="3"/>
  <rect x="248" y="204" width="304" height="68" rx="16" fill="none" stroke="#b3ffff" stroke-opacity=".22"/>
  <text x="400" y="230" text-anchor="middle" fill="#a8f8ec" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="3">MANAGEMENT INFORMATION</text>
  <text x="400" y="258" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="700">DATA  •  INSIGHT  •  ACTION</text>
  <text x="100" y="390" fill="#d9f5ff" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">COLLECT</text>
  <text x="295" y="390" fill="#d9f5ff" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">CONNECT</text>
  <text x="493" y="390" fill="#d9f5ff" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">ANALYZE</text>
  <text x="672" y="390" text-anchor="end" fill="#d9f5ff" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">DECIDE</text>
  <path d="M164 385H262M360 385H458M558 385H637" stroke="url(#accent)" stroke-width="2"/>
</svg>
